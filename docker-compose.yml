services:
  app:
    build: .
    container_name: api_node_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://admin:secret123@mongodb:27017/minha_base?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongodb
      - redis
    networks:
      - rede-app

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
    volumes:
      - mongo_data:/data/db
    networks:
      - rede-app

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    networks:
      - rede-app

volumes:
  mongo_data:
    driver: local

networks:
  rede-app:
    driver: bridge